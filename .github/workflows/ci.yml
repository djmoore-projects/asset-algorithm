name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Catches the class of bug where code writes a column that does not
      # exist. Supabase rejects the row, the error gets swallowed, and the
      # feature breaks somewhere that looks unrelated. Runs against
      # supabase/full-migration.sql, so it needs no secrets.
      - name: Schema audit
        run: npm run check:schema

      - name: TypeScript
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Lint
        run: npx next lint

  # Confirms full-migration.sql still matches the real database. Separate job
  # because it needs credentials, and it should not block a PR from a fork.
  schema-drift:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Schema audit against live database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set. Skipping the live check."
            exit 0
          fi
          node scripts/check-schema.mjs --live
